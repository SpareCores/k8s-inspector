apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-inspector
  namespace: inspector
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [create, get, list, watch, delete, patch]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [create]
- apiGroups: [""]
  resources: [secrets]
  verbs: [create, get, list, watch, update, patch, delete]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, get, list, delete]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, create, update]
- apiGroups: [inspector.sparecores.com]
  resources: [benchmarkruns, benchmarkruns/status]
  verbs: ["*"]
- apiGroups: [""]
  resources: [events]
  verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-inspector
  namespace: inspector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-inspector
subjects:
- kind: ServiceAccount
  name: k8s-inspector
  namespace: inspector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-inspector
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch]
- apiGroups: [karpenter.sh]
  resources: [nodeclaims, nodepools]
  verbs: [get, list, watch]
- apiGroups: [karpenter.sh]
  resources: [nodeclaims]
  verbs: [delete]
- apiGroups: [scarpenter.sparecores.com]
  resources: [scnodeclasses]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-inspector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-inspector
subjects:
- kind: ServiceAccount
  name: k8s-inspector
  namespace: inspector
