apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-inspector
  namespace: inspector
rules:
# Exactly what the controller calls (kube.py); keep in sync when a module gets a new call.
- apiGroups: [""]
  resources: [pods]
  verbs: [create, list, watch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [list]                 # anchor events: FailedScheduling (fast NO_OFFERING) and InsufficientCapacityError (ICE launch failures)
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [get, create]          # exec is a websocket upgrade: a GET, then the create
- apiGroups: [""]
  resources: [secrets]
  verbs: [create, get, update, delete]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, create, patch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, get, list, watch, delete]    # DBaaS: dbaas-up-<run> and dbaas-down-<run> (the sweeper's too)
- apiGroups: [inspector.sparecores.com]
  resources: [benchmarkruns]
  verbs: [create, get, list, watch, patch, delete]    # patch also removes the DBaaS finalizer
- apiGroups: [inspector.sparecores.com]
  resources: [benchmarkruns/status]
  verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-inspector
  namespace: inspector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-inspector
subjects:
- kind: ServiceAccount
  name: k8s-inspector
  namespace: inspector
---
# SCarpenter's LaunchAttempts Events of NodeClaims (kube.list_launch_attempts_events). A NodeClaim has no namespace,
# so Kubernetes puts the Events of it in `default`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-inspector-nodeclaim-events
  namespace: default
rules:
- apiGroups: [""]
  resources: [events]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-inspector-nodeclaim-events
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-inspector-nodeclaim-events
subjects:
- kind: ServiceAccount
  name: k8s-inspector
  namespace: inspector
---
# SCarpenter's offered-types ConfigMaps (planner.not_offered), named scarpenter-offered-<benchClass>-<vendor>. Only
# these are readable; the node bootstrap and credential ConfigMaps of the namespace are not. A non-default benchClass
# or a new SCarpenter vendor needs this list updated.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-inspector-offered-types
  namespace: scarpenter-system
rules:
- apiGroups: [""]
  resources: [configmaps]
  resourceNames:
  - scarpenter-offered-bench-aws
  - scarpenter-offered-bench-gcp
  - scarpenter-offered-bench-azure
  - scarpenter-offered-bench-oci
  - scarpenter-offered-bench-upcloud
  - scarpenter-offered-bench-ovh
  - scarpenter-offered-bench-hcloud
  - scarpenter-offered-bench-vultr
  - scarpenter-offered-bench-alicloud
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-inspector-offered-types
  namespace: scarpenter-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-inspector-offered-types
subjects:
- kind: ServiceAccount
  name: k8s-inspector
  namespace: inspector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-inspector
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get]
- apiGroups: [""]
  resources: [pods]
  verbs: [list]                 # Pods of every namespace on the benchmark node: their CPU requests (step Pod request)
- apiGroups: [karpenter.sh]
  resources: [nodeclaims]
  verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-inspector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-inspector
subjects:
- kind: ServiceAccount
  name: k8s-inspector
  namespace: inspector
