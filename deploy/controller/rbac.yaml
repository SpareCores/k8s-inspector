apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-inspector
  namespace: inspector
rules:
# Exactly what the controller calls (kube.py); keep in sync when a module gets a new call.
- apiGroups: [""]
  resources: [pods]
  verbs: [create, list, watch, delete]
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [get, create]          # exec is a websocket upgrade: a GET, then the create
- apiGroups: [""]
  resources: [secrets]
  verbs: [create, get, update, delete]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, create, patch]
- apiGroups: [inspector.sparecores.com]
  resources: [benchmarkruns]
  verbs: [create, get, list, watch, patch, delete]
- apiGroups: [inspector.sparecores.com]
  resources: [benchmarkruns/status]
  verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-inspector
  namespace: inspector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-inspector
subjects:
- kind: ServiceAccount
  name: k8s-inspector
  namespace: inspector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-inspector
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get]
- apiGroups: [""]
  resources: [pods]
  verbs: [list]                 # Pods of every namespace on the benchmark node: their CPU requests (step Pod request)
- apiGroups: [karpenter.sh]
  resources: [nodeclaims]
  verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-inspector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-inspector
subjects:
- kind: ServiceAccount
  name: k8s-inspector
  namespace: inspector
