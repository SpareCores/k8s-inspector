# ServiceAccount of the DBaaS provisioner Jobs (dbaas-up-<run>, dbaas-down-<run>). It has no Role: the Jobs do not talk to
# the Kubernetes API (automountServiceAccountToken is off, they report through their termination message). The projected
# token (audience sts.amazonaws.com) is how they reach the Pulumi state in the bucket, as the controller does.
# A vendor that uses workload identity for its cloud API gets its own ServiceAccount, named in the ConfigMap
# (`dbaas.vendors.<vendor>.serviceAccount`) and created by the platform together with the cloud-side trust.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-inspector-dbaas
  namespace: inspector
