# Platform-provided objects this Deployment expects (External Secrets / platform config, not in this repository):
#   ConfigMap k8s-inspector-platform: K8SI_BUCKET, K8SI_BUCKET_REGION, K8SI_ROLE_ARN, K8SI_GIT_URL, K8SI_GIT_BRANCH,
#                                     KEEPER_API_BASE
#   Secret    k8s-inspector-git-key:  ssh-privatekey (sc-inspector-data deploy key)
#   Secret    k8s-inspector-keeper:   api-key, and sentry-dsn
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-inspector
  namespace: inspector
  labels: {app.kubernetes.io/name: k8s-inspector}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: k8s-inspector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: k8s-inspector}
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: k8s-inspector
      automountServiceAccountToken: true     # Kubernetes API access
      enableServiceLinks: false
      nodeSelector: {karpenter.sh/nodepool: apps}
      tolerations:
      - {key: frankenscube/apps, operator: Exists}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: controller
        image: ghcr.io/sparecores/k8s-inspector:main
        command: [k8s-inspector, serve]
        ports:
        - {name: metrics, containerPort: 9090}
        env:
        - {name: K8SI_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
        - {name: K8SI_BUCKET, valueFrom: {configMapKeyRef: {name: k8s-inspector-platform, key: K8SI_BUCKET}}}
        - {name: K8SI_BUCKET_REGION, valueFrom: {configMapKeyRef: {name: k8s-inspector-platform, key: K8SI_BUCKET_REGION}}}
        - {name: K8SI_ROLE_ARN, valueFrom: {configMapKeyRef: {name: k8s-inspector-platform, key: K8SI_ROLE_ARN}}}
        - {name: K8SI_GIT_URL, valueFrom: {configMapKeyRef: {name: k8s-inspector-platform, key: K8SI_GIT_URL}}}
        - {name: K8SI_GIT_BRANCH, valueFrom: {configMapKeyRef: {name: k8s-inspector-platform, key: K8SI_GIT_BRANCH}}}
        - {name: K8SI_SC_RUN_IMAGE, value: "ghcr.io/sparecores/k8s-inspector-sc-run:main"}
        - {name: KEEPER_API_BASE, valueFrom: {configMapKeyRef: {name: k8s-inspector-platform, key: KEEPER_API_BASE}}}
        - {name: SENTRY_DSN, valueFrom: {secretKeyRef: {name: k8s-inspector-keeper, key: sentry-dsn, optional: true}}}
        - {name: K8SI_GIT_KEY_FILE, value: /etc/k8s-inspector/git/ssh-privatekey}
        - {name: KEEPER_API_KEY_FILE, value: /etc/k8s-inspector/keeper/api-key}
        # AWS web identity: the SDK exchanges the projected token for a role session.
        - {name: AWS_WEB_IDENTITY_TOKEN_FILE, value: /var/run/secrets/aws/token}
        - {name: AWS_ROLE_ARN, valueFrom: {configMapKeyRef: {name: k8s-inspector-platform, key: K8SI_ROLE_ARN}}}
        - {name: AWS_ROLE_SESSION_NAME, value: k8s-inspector}
        - {name: HOME, value: /work}
        - {name: TMPDIR, value: /tmp}
        livenessProbe:
          httpGet: {path: /metrics, port: metrics}
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: work, mountPath: /work}
        - {name: tmp, mountPath: /tmp}
        - {name: aws-token, mountPath: /var/run/secrets/aws, readOnly: true}
        - {name: git-key, mountPath: /etc/k8s-inspector/git, readOnly: true}
        - {name: keeper-key, mountPath: /etc/k8s-inspector/keeper, readOnly: true}
      volumes:
      - name: work                # git checkout and the sc-data SQLite file
        emptyDir: {sizeLimit: 4Gi}
      - name: tmp
        emptyDir: {sizeLimit: 256Mi}
      - name: aws-token
        projected:
          sources:
          - serviceAccountToken: {audience: sts.amazonaws.com, expirationSeconds: 3600, path: token}
      - name: git-key
        secret:
          secretName: k8s-inspector-git-key
          defaultMode: 0440
      - name: keeper-key
        secret:
          secretName: k8s-inspector-keeper
          defaultMode: 0440
          items: [{key: api-key, path: api-key}]
