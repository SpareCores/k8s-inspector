[project]
name = "k8s-inspector"
version = "0.1.0"
description = "Controller of k8s-inspector: plans, runs and publishes Spare Cores benchmark runs on Kubernetes"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "lightkube",
    "boto3",
    "pyyaml",
    "dmiparser",
    "dateparser",
    "fastnumbers",
    "lxml",
]

[project.scripts]
k8s-inspector = "k8s_inspector.cli:main"

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["k8s_inspector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
